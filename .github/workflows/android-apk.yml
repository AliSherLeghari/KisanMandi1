name: Test and build KisanMandi Android APK
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test seeded HTTP mock API
        working-directory: api
        run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --org pk.kisanmandi --project-name kisanmandi .
      - name: Enable Android Internet permission
        run: python3 scripts/ensure_android_internet.py
      - name: Install Flutter packages
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build release APK
        env:
          KISAN_API_URL: ${{ vars.KISAN_API_BASE_URL }}
        run: |
          if [ -z "$KISAN_API_URL" ]; then
            echo '::warning::KISAN_API_BASE_URL is empty; APK will display API setup instructions until rebuilt with a deployed URL.'
          fi
          flutter build apk --release --dart-define="API_BASE_URL=$KISAN_API_URL"
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: kisanmandi-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
